<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">

<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
/* =========================================================
   SAFFRON FOOD — PREMIUM HORIZONTAL MENU UI
   ========================================================= */

:root {
    --saffron-red: #8f0909;
    --saffron-dark: #690606;
    --saffron-gold: #e0a11a;
    --card-cream: #fff4d7;
    --page-bg: #f6f6f6;
    --text-dark: #161616;
    --text-muted: #555;
    --border: #e8e8e8;
    --white: #ffffff;
}

/* =========================
   GLOBAL
   ========================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
}

html {
    scroll-behavior: smooth;
}

body {
    background: var(--page-bg);
    color: var(--text-dark);
    min-height: 100vh;
    overflow-x: hidden;
}

/* =========================
   MAIN APP
   ========================= */

.app-container {
    width: 100%;
    max-width: 1200px;
    min-height: 100vh;
    margin: 0 auto;
    background: var(--white);
    position: relative;
    padding-bottom: 100px;
}

/* =========================
   HEADER
   ========================= */

header {
    position: relative;
    height: 76px;
    background: #ffffff;
    border-bottom: 1px solid #eeeeee;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--saffron-red);
}

header h1 {
    color: var(--saffron-red);
    font-size: 27px;
    font-weight: 800;
    letter-spacing: -0.5px;
}

/* =========================
   MENU BUTTON
   ========================= */

.menu-btn {
    position: absolute;
    right: 25px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 5px;
    padding: 7px;
    z-index: 20;
}

.bar {
    width: 25px;
    height: 3px;
    background: var(--saffron-red);
    border-radius: 5px;
}

/* =========================
   SEARCH
   ========================= */

.search-container {
    width: 100%;
    max-width: 1050px;
    margin: 22px auto 12px;
    padding: 0 20px;
}

.search-wrapper {
    height: 52px;
    display: flex;
    align-items: center;
    background: #ffffff;
    border: 1px solid #dddddd;
    border-radius: 14px;
    padding: 0 16px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
}

.search-wrapper span {
    font-size: 18px;
}

.search-wrapper input {
    width: 100%;
    border: none;
    outline: none;
    margin-left: 10px;
    font-size: 15px;
    color: #222;
    background: transparent;
}

/* =========================
   MENU AREA
   ========================= */

#menu-container {
    background: #ffffff !important;
    padding: 0 20px 30px;
}

/* =========================
   CATEGORY
   ========================= */

.category-title {
    max-width: 1050px;
    margin: 20px auto 13px;

    color: var(--saffron-red);
    font-size: 23px;
    font-weight: 800;

    padding: 10px 0;
    border-bottom: 2px solid #eeeeee;

    text-transform: uppercase;
}

/* =========================
   FOOD GRID
   ========================= */

.menu-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 20px;
    width: 100%;
}

/* =========================
   FOOD CARD
   ========================= */

.menu-item {
    width: 100%;
    min-height: 140px;

    display: grid !important;
    grid-template-columns: 128px minmax(0, 1fr);
    gap: 12px;

    padding: 10px;

    background: var(--card-cream) !important;

    border: 1px solid #f1e2bd;
    border-radius: 18px;

    box-shadow:
        0 5px 15px rgba(0, 0, 0, 0.10);

    overflow: hidden;

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
}

.menu-item:hover {
    transform: translateY(-2px);

    box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.14);
}

/* =========================
   FOOD IMAGE
   ========================= */

.menu-item > div:first-child {
    grid-row: 1 / 5;

    width: 128px !important;
    height: 118px !important;

    border-radius: 12px !important;

    overflow: hidden;

    background: #eeeeee !important;

    position: relative;
}

.menu-item > div:first-child img {
    width: 100% !important;
    height: 100% !important;

    display: block;

    object-fit: cover !important;
}

/* =========================
   FOOD INFO
   ========================= */

.item-name {
    color: var(--saffron-red) !important;

    font-size: 20px;
    line-height: 1.12;

    font-weight: 800;

    margin: 3px 3px 0 !important;

    text-transform: capitalize;
}

/* =========================
   DESCRIPTION
   ========================= */

.item-description {
    color: #333333;

    font-size: 12.5px;
    line-height: 1.25;

    margin: 3px 3px 0;

    display: -webkit-box;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

/* =========================
   FOOD TYPE ICON
   ========================= */

.food-type-icon {
    display: inline-flex;

    width: 17px;
    height: 17px;

    align-items: center;
    justify-content: center;

    border: 1.5px solid #d71920;

    margin-right: 7px;

    vertical-align: middle;

    border-radius: 2px;

    font-size: 10px;
    font-weight: 900;

    color: #d71920;

    flex-shrink: 0;
}

PRICE
  
.price-text {
    color: var(--saffron-red) !important;

    font-size: 21px !important;
    font-weight: 800 !important;

    margin: 2px 3px 0 !important;
}

/* =========================
   ADD BUTTON
   ========================= */

#menu-container .add-btn {
    width: auto;

    min-width: 70px;

    background: var(--saffron-red) !important;

    color: #ffffff !important;

    border: none !important;

    padding: 9px 13px;

    margin: 3px 3px 0 auto;

    border-radius: 22px;

    font-size: 13px;
    font-weight: 800;

    cursor: pointer;

    box-shadow:
        0 5px 12px rgba(143, 9, 9, 0.28);

    transition: 0.2s ease;
}

#menu-container .add-btn:hover {
    background: var(--saffron-dark) !important;

    transform: translateY(-1px);
}

/* =========================
   QUANTITY CONTROLS
   ========================= */

.qty-selector {
    display: flex;

    align-items: center;
    justify-content: flex-end;

    gap: 9px;

    margin: 4px 3px 0 !important;

    color: var(--saffron-red) !important;
}

.qty-selector span {
    color: var(--saffron-red) !important;

    font-weight: 800 !important;

    min-width: 20px;

    text-align: center;
}

.ctrl-btn {
    width: 30px;
    height: 30px;

    border: none;

    border-radius: 50%;

    background: var(--saffron-red) !important;

    color: #ffffff !important;

    font-size: 17px;

    font-weight: 800;

    cursor: pointer;
}

/* =========================
   CART BAR
   ========================= */

.view-cart-trigger {
    position: fixed;

    bottom: 18px;

    left: 50%;

    transform: translateX(-50%);

    width: min(92%, 500px);

    background: var(--saffron-red) !important;

    color: #ffffff !important;

    padding: 15px 20px;

    border-radius: 15px;

    text-align: center;

    font-weight: 800;

    z-index: 999;

    box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.20);
}

/* =========================
   MODALS
   ========================= */

.modal-overlay {
    display: none;

    position: fixed;

    inset: 0;

    background: rgba(0, 0, 0, 0.65);

    z-index: 2000;

    justify-content: center;
    align-items: center;

    padding: 20px;
}

.compact-popup {
    width: 100%;
    max-width: 400px;

    background: #ffffff;

    padding: 25px;

    border-radius: 20px;

    text-align: center;
}

#cart-modal {
    display: none;

    position: fixed;

    inset: 0;

    background: rgba(0, 0, 0, 0.65);

    z-index: 1000;

    justify-content: center;

    align-items: flex-end;
}

.cart-content {
    width: 100%;
    max-width: 600px;

    background: #ffffff;

    border-radius: 22px 22px 0 0;

    padding: 22px;

    max-height: 90vh;

    overflow-y: auto;
}

.billing-box {
    background: #ffffff;

    border: 1px solid #eeeeee;

    border-radius: 14px;

    padding: 15px;

    margin-bottom: 15px;

    color: #000000;
}

.cart-row {
    display: flex;

    justify-content: space-between;

    padding: 10px 0;

    border-bottom: 1px solid #eeeeee;
}

.order-form input,
.order-form select {
    width: 100%;

    padding: 13px;

    margin-bottom: 10px;

    border: 1px solid #dddddd;

    border-radius: 10px;

    font-size: 16px;
}

.place-order-btn {
    width: 100%;

    padding: 15px;

    border: none;

    border-radius: 12px;

    background: #18a957;

    color: #ffffff;

    font-size: 17px;

    font-weight: 800;

    cursor: pointer;
}

/* =========================
   SIDEBAR
   ========================= */

.sidebar {
    position: fixed;

    top: 0;
    left: -300px;

    width: 300px;
    height: 100%;

    background: #ffffff;

    color: #222222;

    z-index: 10000;

    transition: 0.3s ease;

    display: flex;

    flex-direction: column;

    box-shadow: 8px 0 25px rgba(0,0,0,0.18);
}

.sidebar.active {
    left: 0;
}

.sidebar-header {
    padding: 22px 20px;

    background: var(--saffron-red);

    color: #ffffff;

    display: flex;

    justify-content: space-between;

    align-items: center;
}

.sale-card {
    background: var(--card-cream);

    padding: 18px;

    border-radius: 14px;

    margin: 15px;

    border-left: 4px solid var(--saffron-gold);
}

#sidebar-overlay {
    display: none;

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,0.55);

    z-index: 9999;
}

.login-box h2 {
    color: #ffffff;
}

/* =========================
   HISTORY
   ========================= */

.history-card {
    background: #ffffff;

    border: 1px solid #eeeeee;

    border-radius: 14px;

    padding: 12px;

    box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

/* =========================
   MOBILE BOTTOM NAV
   ========================= */

.mobile-only-bar {
    background: #ffffff !important;

    border-top: 1px solid #eeeeee;

    box-shadow: 0 -4px 15px rgba(0,0,0,0.08) !important;
}

.mobile-only-bar {
    position: fixed !important;
    bottom: 14px !important;
    left: 50% !important;
    transform: translateX(-50%) !important;

    width: calc(100% - 50px) !important;
    max-width: 500px !important;
    height: 62px !important;

    background: rgba(255, 255, 255, 0.97) !important;
    border: 1px solid #eeeeee !important;
    border-radius: 20px !important;

    box-shadow: 0 10px 35px rgba(0, 0, 0, 0.18) !important;

    display: flex !important;
    align-items: center !important;
    justify-content: space-around !important;

    z-index: 10005 !important;
    overflow: hidden;
    backdrop-filter: blur(10px);
}

.mobile-only-bar a {
    color: #222222 !important;
    text-decoration: none !important;

    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    justify-content: center !important;

    gap: 3px;
    min-width: 70px;
    height: 60px;

    font-size: 13px;
    font-weight: 700;
    border-radius: 18px;
}

.mobile-only-bar a span {
    color: var(--saffron-red) !important;
    font-size: 24px !important;
    line-height: 1;
}

.mobile-only-bar a #cart-count {
    display: inline !important;
    width: auto !important;
    height: auto !important;
    margin: 0 !important;
    padding: 0 !important;
    font-size: 11px !important;
    line-height: 1 !important;
    color: #8f1117 !important;
    font-weight: 800 !important;
}

.mobile-only-bar a:active {
    transform: scale(0.94);
}

/* =========================================================
   TABLET
   ========================================================= */

@media (max-width: 900px) {

    .menu-grid {
        grid-template-columns: 1fr;
        max-width: 700px;
    }
}

/* =========================================================
   MOBILE — MATCH THE REFERENCE UI
   ========================================================= */

@media (max-width: 600px) {

    body {
        background: #ffffff;
    }

    .app-container {
        width: 100%;
        max-width: 100%;

        padding-bottom: 90px;
    }

    /* Header */

    header {
        height: 68px;

        justify-content: flex-start;

        padding: 0 18px;
    }

    header h1 {
        font-size: 22px;
    }

    .menu-btn {
        right: 12px;
    }

    /* Search */

    .search-container {
        margin: 15px auto 10px;

        padding: 0 12px;
    }

    .search-wrapper {
        height: 48px;

        border-radius: 13px;
    }

    /* Menu */

    #menu-container {
        padding: 0 10px 25px !important;
    }

    .category-title {
    width: 100%;
    max-width: 1450px;
    margin: 0 auto 18px;
    padding: 22px 0 12px;
    color: var(--primary);
    font-size: 25px;
    font-weight: 800;
    text-transform: none;
    border-bottom: 2px solid #eeeeee;
}

    /* Grid */

    .menu-grid {
        display: grid;

        grid-template-columns: 1fr;

        gap: 13px;

        width: 100%;
    }

    /* Card */

    .menu-item {
        grid-template-columns: 118px minmax(0, 1fr);

        gap: 11px;

        min-height: 139px;

        padding: 9px;

        border-radius: 17px;
    }

    /* Image */

    .menu-item > div:first-child {
        width: 118px !important;

        height: 118px !important;

        border-radius: 11px !important;
    }

    /* Name */

    .item-name {
        font-size: 20px;

        line-height: 1.08;

        margin-top: 4px !important;
    }

    /* Description */

    .item-description {
        font-size: 12px;

        line-height: 1.25;

        margin-top: 4px;
    }

    /* Price */

    .price-text {
        font-size: 21px !important;

        margin-top: 4px !important;
    }

    /* Add */

    #menu-container .add-btn {
        padding: 9px 13px;

        font-size: 13px;

        min-width: 68px;
    }

    /* Cart */

    .view-cart-trigger {
        bottom: 72px;

        width: calc(100% - 24px);

        border-radius: 14px;
    }
}

/* =========================================================
   SMALL PHONES
   ========================================================= */

@media (max-width: 380px) {

    .menu-item {
        grid-template-columns: 102px minmax(0, 1fr);

        gap: 10px;
    }

    .menu-item > div:first-child {
        width: 102px !important;

        height: 102px !important;
    }

    .item-name {
        font-size: 17px;
    }

    .item-description {
        font-size: 11px;
    }

    .price-text {
        font-size: 19px !important;
    }
}
/* =========================================================
   SAFFRON PROMO BANNER SLIDER
   ========================================================= */

.promo-slider {
    width: 100%;
    max-width: 1100px;
    margin: 20px auto;
    overflow: hidden;
    border-radius: 16px;
}

.promo-track {
    display: flex;
    gap: 16px;
}

.promo-slide {
    flex: 0 0 calc((100% - 32px) / 3);
    overflow: hidden;
    border-radius: 16px;
}

.promo-slide img {
    display: block;
    width: 100%;
    height: auto;
    object-fit: contain;
}

/* =========================
   MOBILE
   ========================= */

@media (max-width: 500px) {

    .promo-slider {
    width: 100%;
}

    .promo-track {
    gap: 0;
    transition: transform 1s ease;
}

    .promo-slide {
        flex: 0 0 100%;
        min-width: 100%;
        border-radius: 14px;
    }

    .promo-slide img {
    width: 100%;
    height: 120px;
    aspect-ratio: auto;
    object-fit: fill;
}
}
</style>
</head>

        </div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    console.log("PROMO JS LOADED");

    const slider = document.querySelector(".promo-slider");
    const track = document.querySelector(".promo-track");
    const slides = document.querySelectorAll(".promo-slide");

    let currentSlide = 0;
    const originalSlideCount = slides.length;

    const firstSlideClone = slides[0].cloneNode(true);
    track.appendChild(firstSlideClone);

    function moveSlider() {

        if (window.innerWidth <= 600) {

            currentSlide++;

            const slideWidth = slides[0].clientWidth;

            track.style.transform =
                `translateX(-${currentSlide * slideWidth}px)`;

            if (currentSlide === originalSlideCount) {

                setTimeout(function () {

                    track.style.transition = "none";
                    currentSlide = 0;

                    track.style.transform = "translateX(0)";

                    track.offsetHeight;

                    track.style.transition = "transform 0.3s ease";

                }, 300);
            }

        } else {

            currentSlide = 0;
            track.style.transform = "translateX(0)";
        }
    }

    setInterval(moveSlider, 1000);

});
</script>

<script>
async function openHistoryPopup() {
  showScreen('other');
  var historyList = document.getElementById('history-items-list');
  historyList.innerHTML = '<div style="text-align:center; color:#777; margin-top:40px; font-family:sans-serif;">⏳ Loading your premium history...</div>';
  
  // Full screen flex show
  var popup = document.getElementById('history-popup');
  popup.style.display = 'flex';
  document.body.style.overflow = 'hidden';

  var savedProfile = JSON.parse(localStorage.getItem('saffron_profile')) || {};
  var customerPhone = savedProfile.phone ? savedProfile.phone.trim() : "";

  if (!customerPhone) {
    var pInp = document.getElementById('cust-phone');
    if (pInp && pInp.value) {
      customerPhone = pInp.value.trim();
    }
  }

  if (!customerPhone) {
    historyList.innerHTML = `
      <div style="text-align:center; color:#777; margin-top:40px; padding: 0 20px; font-family:sans-serif;">
        <p style="margin-bottom:15px; font-weight:500;">🔒 Please fill your Profile first with your phone number to check live history!</p>
        <button onclick="document.getElementById('history-popup').style.display='none'; toggleProfileScreen(true);" style="background:var(--zomato-yellow); border:none; padding:12px 25px; border-radius:10px; font-weight:bold; cursor:pointer; width:100%;">Open Profile 👤</button>
      </div>`;
    return;
  }

  try {
    var res = await fetch(G_SCRIPT_URL);
    var data = await res.json();
    var allOrders = Array.isArray(data) ? data : (data.orders || []);
    
    var userOrders = allOrders.filter(function(order) {
      var sheetPhone = order.phone ? String(order.phone).replace(/[^0-9]/g, '') : '';
      var searchPhone = customerPhone.replace(/[^0-9]/g, '');
      return sheetPhone.includes(searchPhone) || searchPhone.includes(sheetPhone);
    });

    if (userOrders.length === 0) {
      historyList.innerHTML = '<div style="text-align:center; color:#777; margin-top:40px; font-family:sans-serif;">No orders found for your number! 🍔</div>';
    } else {
      historyList.innerHTML = '';
      
      for (var i = userOrders.length - 1; i >= 0; i--) {
        var order = userOrders[i];
        var card = document.createElement('div');
        
        // Premium Premium Card Styling with Pink Accents
        card.style.background = '#ffffff';
        card.style.border = '1px solid #f8bbd0';
        card.style.borderRadius = '16px';
        card.style.padding = '15px';
        card.style.boxShadow = '0 4px 12px rgba(216,27,96,0.04)';
        card.style.display = 'flex';
        card.style.flexDirection = 'column';
        card.style.gap = '8px';

        var orderDate = order.date || "Recent Order";
        var orderType = order.type || "Dining";
        var typeColor = orderType === "Home Delivery" ? "#0288d1" : "#e65100";
        var typeBg = orderType === "Home Delivery" ? "#e3f2fd" : "#fff3e0";

                card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px dashed #f5f5f5; padding-bottom:8px;">
            <span style="font-size:12px; color:#666; font-weight:500;">📅 ${orderDate}</span>
            <span style="color:${typeColor}; background:${typeBg}; font-weight:bold; font-size:11px; padding:3px 8px; border-radius:12px; text-transform:uppercase;">${orderType}</span>
          </div>
          <div style="font-weight:600; color:#1a1a1a; font-size:14px; line-height:1.4; padding:5px 0;">
            🍔 ${order.items}
          </div>
          <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid #f5f5f5; padding-top:8px; margin-top:2px;">
            <span style="font-size:12px; color:#888;">Method: ${order.payment || 'Cash'}</span>
            <span style="font-weight:bold; color:#d81b60; font-size:15px;">₹${order.total}</span>
          </div>
        `;

        historyList.appendChild(card);
      }
    }
  } catch (e) {
    console.log("History load error:", e);
    historyList.innerHTML = '<div style="text-align:center; color:#ff3b30; margin-top:40px; font-family:sans-serif;">⚠️ Connection Error! Please try again.</div>';
  }
}

// --- Function: Jab customer Order Place kare, tab automatic history me save ho jaye ---
function setupOrderTracking() {
// Aapki website ke main 'Place Order' button ko target karna
var placeOrderBtn = document.querySelector('.place-order-btn, #place-order, [onclick*="sendWhatsApp"], .checkout-btn');

if (placeOrderBtn) {
placeOrderBtn.addEventListener('click', function() {
try {
// Aapke cart elements se text nikalna (IDs aapki website ke elements ke matching hain)
var cartItemsText = "";
var allItems = document.querySelectorAll('.cart-item, .cart-items div, #cart-items div');

if(allItems.length > 0) {
var itemsArray = [];
allItems.forEach(function(item) {
if(item.innerText.trim() !== "") itemsArray.push(item.innerText.trim().split('\n')[0]);
});
cartItemsText = itemsArray.join(', ');
} else {
cartItemsText = "Delicious Food Items";
}

var totalAmountElement = document.querySelector('#total-price, #cart-total, .total-amount, #total');
var totalAmount = totalAmountElement ? totalAmountElement.innerText.replace(/[^0-9]/g, '') : '0';

if (totalAmount === '0' || totalAmount === '') return; // Khali cart save na ho

var currentDate = new Date().toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

var newOrder = {
date: currentDate,
items: cartItemsText,
total: totalAmount
};

var currentOrders = JSON.parse(localStorage.getItem('saffron_orders')) || [];
currentOrders.push(newOrder);
localStorage.setItem('saffron_orders', JSON.stringify(currentOrders));
} catch (e) {
console.log("History save error:", e);
}
});
}
}

// Automatically active functions when page loads
setTimeout(setupOrderTracking, 1500);

}
} else {

navBar.style.borderTop = 'none';
}
}, 300);
</script>

let cart = [];
function renderMenu() {
  const container = document.getElementById('menu-container');
  container.innerHTML = menuData.map(section => `
    <h2 class="category-title">${section.category}</h2>
    <div class="menu-grid">${section.items.map(item => `
      <div class="menu-item" style="gap: 8px; display: flex; flex-direction: column; justify-content: space-between;">
        <!-- 📸 PREMIUM FOOD IMAGE BOX -->
        <div style="width: 100%; height: 110px; border-radius: 14px; overflow: hidden; background: #2d2d2d; position: relative;">
          <img src="${item.image || 'https://unsplash.com'}" alt="${item.name}" style="width: 100%; height: 100%; object-fit: cover;">
        </div>
        <div class="item-name" style="margin-top: 4px;">${item.name}</div>
        <div class="price-text" style="color: #8f1117 !important; font-weight: bold; font-size: 0.9rem;">${item.priceHalf ? `H: ₹${item.priceHalf} / F: ₹${item.priceFull}` : `₹${item.price}`}</div>
       <div id="ctrls-${item.id}"><button class="add-btn" onclick="handleItemClick(${item.id})">Add Item</button></div>
      </div>`).join('')}</div>`).join('');
}

function handleItemClick(id) {
let itemRef; menuData.forEach(cat => { const found = cat.items.find(i => i.id === id); if(found) itemRef = found; });
if (itemRef.priceHalf) openSizePopup(itemRef); else addToCart(id, 'Normal');
}

function openSizePopup(item) {
document.getElementById('popup-item-name').innerText = item.name;
document.getElementById('size-options-list').innerHTML = `
<div style="padding:15px; background:white; border-radius:10px; margin-bottom:10px; font-weight:bold; cursor:pointer;" onclick="selectFromPopup(${item.id}, 'Half')">Half - ₹${item.priceHalf}</div>
<div style="padding:15px; background:white; border-radius:10px; font-weight:bold; cursor:pointer;" onclick="selectFromPopup(${item.id}, 'Full')">Full - ₹${item.priceFull}</div>`;
document.getElementById('size-popup').style.display = 'flex';
}

function selectFromPopup(id, size) { addToCart(id, size); closeSizePopup(); }
function closeSizePopup() { document.getElementById('size-popup').style.display = 'none'; }

function addToCart(id, size) {
let itemRef; menuData.forEach(cat => { const found = cat.items.find(i => i.id === id); if(found) itemRef = found; });
const price = size === 'Half' ? itemRef.priceHalf : (size === 'Full' ? itemRef.priceFull : itemRef.price);
const cartKey = `${id}-${size}`;
const existing = cart.find(c => c.cartKey === cartKey);
if (existing) existing.qty++; else cart.push({ ...itemRef, size, price, qty: 1, cartKey });
updateItemControls(id, size); updateCartUI();
}

function updateItemControls(id, size) {
const container = document.getElementById(`ctrls-${id}`);
if(!container) return;
const cartKey = `${id}-${size}`;
const itemInCart = cart.find(c => c.cartKey === cartKey);
if (itemInCart && itemInCart.qty > 0) {
container.innerHTML = `<div class="qty-selector"><button class="ctrl-btn" onclick="updateQty('${cartKey}', -1)">-</button><span style="color:white;">${itemInCart.qty}</span><button class="ctrl-btn" onclick="updateQty('${cartKey}', 1)">+</button></div>`;
} else {
container.innerHTML = `<button class="add-btn" onclick="handleItemClick(${id})">Add Item</button>`;
}
}

function updateQty(cartKey, delta) {
const index = cart.findIndex(c => c.cartKey === cartKey);
if (index > -1) {
cart[index].qty += delta;
const itemId = cart[index].id; const size = cart[index].size;
if (cart[index].qty <= 0) cart.splice(index, 1);
updateItemControls(itemId, size);
}
updateCartUI();
}

function updateCartUI() {
const container = document.getElementById('cart-items-container');
let total = 0, count = 0;

if (cart.length === 0) {
if (container) container.innerHTML = "<p style='color:#666; text-align:center; padding:20px;'>Cart is empty.</p>";
} else {
if (container) {
container.innerHTML = cart.map(item => {
const subtotal = item.price * item.qty;
total += subtotal;
count += item.qty;

const sizeText = item.size !== 'Normal' ? ' (' + item.size + ')' : '';

return `
<div class="cart-row" style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee;">
<div style="flex: 1; color: #000; font-weight: 500;">
${item.name}${sizeText}
</div>

<!-- यहाँ क्वांटिटी बदलने के लिए + / - बटन्स -->
<div style="display: flex; align-items: center; gap: 8px; margin-right: 15px;">
<button onclick="updateQty('${item.cartKey}', -1)" style="background: #ffd600; border: none; width: 25px; height: 25px; border-radius: 5px; font-weight: bold; cursor: pointer; color: #000; font-size: 1rem; display: flex; align-items: center; justify-content: center;">-</button>
<span style="font-weight: bold; color: #000; min-width: 15px; text-align: center;">${item.qty}</span>
<button onclick="updateQty('${item.cartKey}', 1)" style="background: #ffd600; border: none; width: 25px; height: 25px; border-radius: 5px; font-weight: bold; cursor: pointer; color: #000; font-size: 1rem; display: flex; align-items: center; justify-content: center;">+</button>
</div>

<div style="color: #000; font-weight: bold; min-width: 60px; text-align: right;">
₹${subtotal}
</div>
</div>`;
}).join('');
}
}

document.getElementById('cart-count').innerText = count;
document.getElementById('grand-total').innerText = total;
}

function filterMenu() {
const query = document.getElementById('menu-search').value.toLowerCase();

// 1. पहले सारे आइटम्स को सर्च क्वेरी के हिसाब से छुपाएं या दिखाएं
const items = document.querySelectorAll('.menu-item');
items.forEach(item => {
const name = item.querySelector('.item-name').innerText.toLowerCase();
item.style.display = name.includes(query) ? "flex" : "none";
});

// 2. अब चेक करें कि किस कैटेगरी में एक भी आइटम दिखाई दे रहा है या नहीं
const categoryTitles = document.querySelectorAll('.category-title');
categoryTitles.forEach(title => {
// हर टाइटल के ठीक आगे वाला ग्रिड बॉक्स ढूंढें जिसमें आइटम्स रखे हैं
const nextGrid = title.nextElementSibling;
if (nextGrid && nextGrid.classList.contains('menu-grid')) {
// चेक करें कि क्या उस ग्रिड के अंदर कोई भी आइटम 'flex' (दिखने वाला) है
const hasVisibleItems = Array.from(nextGrid.children).some(item => item.style.display !== 'none');

// अगर एक भी आइटम नहीं दिख रहा, तो पूरी कैटेगरी हेडिंग को छुपा दें
title.style.display = hasVisibleItems ? "block" : "none";
nextGrid.style.display = hasVisibleItems ? "grid" : "none";
}
});
}
function handleStoreToggle() {
const toggle = document.getElementById('store-toggle');
const statusBg = document.getElementById('status-bg');
const labelText = document.getElementById('status-label-text');
const circle = document.getElementById('toggle-circle');

if (toggle && statusBg && labelText && circle) {
if (toggle.checked) {
statusBg.style.background = '#4cd964'; // हरा रंग (Online)
labelText.innerText = "Online";
circle.style.transform = "translateX(0)";
} else {
statusBg.style.background = '#777777'; // ग्रे रंग (Offline)
labelText.innerText = "Offline";
circle.style.transform = "translateX(4px)"; // स्विच इफेक्ट
}
}
}


function toggleCart(show) {

document.getElementById('cart-modal').style.display = show ? 'flex' : 'none';

if (show) {
document.body.style.overflow = 'hidden';
} else {
document.body.style.overflow = 'auto';
}

}
async function toggleSidebar() {
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('sidebar-overlay');

sidebar.classList.toggle('active');
overlay.style.display = sidebar.classList.contains('active') ? 'block' : 'none';

if (sidebar.classList.contains('active')) {
document.getElementById('dtd-value').innerText = "Loading...";
document.getElementById('mtd-value').innerText = "Loading...";
try {
const res = await fetch(G_SCRIPT_URL);
const data = await res.json();
document.getElementById('dtd-value').innerText = `₹${data.dtd.toLocaleString('en-IN')}`;
document.getElementById('mtd-value').innerText = `₹${data.mtd.toLocaleString('en-IN')}`;
} catch (e) {
document.getElementById('dtd-value').innerText = "Error";
document.getElementById('mtd-value').innerText = "Error";
}
}
}

function placeOrder() {
  const toggleBtn = document.getElementById('store-toggle');
  if (toggleBtn && !toggleBtn.checked) {
    alert("🚨 Sorry, Restaurant is Closed Right Now! Will open at 10am.");
    return;
  }
  if (cart.length === 0) {
    alert("Your cart is empty!");
    return;
  }
  
  const nInp = document.getElementById('cust-name');
  const pInp = document.getElementById('cust-phone');
  const tInp = document.getElementById('order-type');
  const aInp = document.getElementById('cust-address');
  const mInp = document.getElementById('payment-method');
  const grandTotal = document.getElementById('grand-total').innerText;

  if (!pInp || !nInp || !pInp.value || !nInp.value) { 
    alert("Fill Name & Phone!"); 
    return; 
  }

  // Exact JSON key structure to match your sheet columns
  const orderData = {
    name: nInp.value.trim(), 
    phone: pInp.value.trim(), 
    type: tInp.value,
    items: cart.map(i => `${i.name}(${i.size || 'Normal'})x${i.qty}`).join(", "),
    total: grandTotal, 
    payment: mInp.value,
    address: (tInp.value === 'Home Delivery' && aInp) ? aInp.value.trim() : "N/A"
  };

  // Sending directly to your newly deployed Google Sheet Web App
  fetch(G_SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(orderData)
  }).catch(e => console.log("Google Sheet Secure Send Error:", e));

  // WhatsApp Format Message Building
  let msg = `*SAFFRON FOOD*\n\n*Order Summary:*\n`;
  cart.forEach(item => {
    msg += `* ${item.name}${item.size !== 'Normal' ? ' (' + item.size + ')' : ''} x${item.qty} = ₹${item.price * item.qty}\n`;
  });

  msg += `\n*TOTAL: ₹${grandTotal}*\n\n`;
  msg += `👤 ${nInp.value}\n`;
  msg += `🍽️ ${tInp.value}\n`;
  if(tInp.value === 'Home Delivery' && aInp && aInp.value) {
    msg += `📍 ${aInp.value}\n`;
  }
  msg += `💳 ${mInp.value}`;

  window.open(`https://wa.me/7618003177?text=${encodeURIComponent(msg)}`, '_blank');
  
  setTimeout(() => {
    cart = [];
    location.reload();
  }, 1000);
}
// --- Function: Manage Screens Switching ---
function showScreen(screenType) {
  if(document.getElementById('profile-screen')) document.getElementById('profile-screen').style.display = 'none';
  if(document.getElementById('history-popup')) document.getElementById('history-popup').style.display = 'none';
  if(document.getElementById('cart-modal')) document.getElementById('cart-modal').style.display = 'none';
  
  document.body.style.overflow = 'auto';

  if (screenType === 'home') {
    window.scrollTo({top: 0, behavior: 'smooth'});
  }
}

// --- Function: Profile Screen Toggle (Open/Close) ---
function toggleProfileScreen(show) {
  if (show) {
    showScreen('other');
  }
  const profileScreen = document.getElementById('profile-screen');
  if (profileScreen) {
    profileScreen.style.display = show ? 'flex' : 'none';
    document.body.style.overflow = show ? 'hidden' : 'auto';
  }
}

// --- Function: Save Profile Details to LocalStorage ---
function saveProfileDetails() {
  const name = document.getElementById('prof-name').value.trim();
  const phone = document.getElementById('prof-phone').value.trim();
  const address = document.getElementById('prof-address').value.trim();

  if (!name || !phone) {
    alert("Please fill your Name and WhatsApp Number!");
    return;
  }

  const profileData = { name: name, phone: phone, address: address };
  localStorage.setItem('saffron_profile', JSON.stringify(profileData));
  
  autoFillCheckoutFields();
  
  alert("Profile saved successfully! 💾");
  toggleProfileScreen(false);
}

// --- Function: Auto-fill fields from LocalStorage on page load ---
function autoFillCheckoutFields() {
  const savedProfile = JSON.parse(localStorage.getItem('saffron_profile'));
  if (savedProfile) {
    if(document.getElementById('prof-name')) document.getElementById('prof-name').value = savedProfile.name;
    if(document.getElementById('prof-phone')) document.getElementById('prof-phone').value = savedProfile.phone;
    if(document.getElementById('prof-address')) document.getElementById('prof-address').value = savedProfile.address;

    if(document.getElementById('cust-name')) document.getElementById('cust-name').value = savedProfile.name;
    if(document.getElementById('cust-phone')) document.getElementById('cust-phone').value = savedProfile.phone;
    if(document.getElementById('cust-address')) document.getElementById('cust-address').value = savedProfile.address;
  }
}

// Run auto-fill when the page finishes loading
window.addEventListener('DOMContentLoaded', autoFillCheckoutFields);

</script>
